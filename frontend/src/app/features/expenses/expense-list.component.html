<div class="page-stack">
  <app-page-header title="Expenses" icon="wallet" subtitle="Expenses reduce profit on their own date. Anything paid in cash also leaves the drawer.">
    @if (canWrite) {
      <div class="contents">
        <button type="button" class="btn btn-primary" (click)="create()">
          <lucide-icon name="plus" [size]="15" />
          Record expense
        </button>
      </div>
    }
  </app-page-header>

  <tt-data-grid
      #grid
      gridKey="expenses"
      [columns]="columns"
      [dataSource]="dataSource"
      [actions]="actions"
      [defaultSort]="[{ field: 'expenseDate', desc: true }]"
      searchPlaceholder="Search category, note or shop"
      emptyTitle="No expenses yet"
      emptyText="Rent, salaries, utilities and anything else the shop pays out."
    />
</div>

<tt-drawer
  [open]="drawerOpen()"
  [heading]="editingId() ? 'Edit expense' : 'Record expense'"
  (closed)="close()"
>
  <form class="grid gap-3.5" (ngSubmit)="save()" id="expense-form">
    <div class="block min-w-0">
      <label class="label" for="shop">Shop</label>
      <select id="shop" class="select" name="shopId"
              [class.invalid]="errors()['shopId']"
              [ngModel]="shopId()" (ngModelChange)="shopId.set(+$event)">
        @for (shop of shops(); track shop.id) {
          <option [value]="shop.id">{{ shop.name }}</option>
        }
      </select>
      @if (errors()['shopId']) {
        <p class="error-text">{{ errors()['shopId'] }}</p>
      }
    </div>

    <div class="block min-w-0">
      <label class="label" for="category">Category</label>
      <select id="category" class="select" name="categoryId"
              [class.invalid]="errors()['categoryId']"
              [ngModel]="categoryId()" (ngModelChange)="categoryId.set(+$event)">
        <option [value]="0" disabled>Choose a category</option>
        @for (category of categories(); track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      </select>
      @if (errors()['categoryId']) {
        <p class="error-text">{{ errors()['categoryId'] }}</p>
      }
    </div>

    @if (canWrite) {
      <div class="block min-w-0">
        <label class="label" for="new-category">Add a category</label>
        <div class="inline-add">
          <input id="new-category" class="input" name="newCategory"
                 placeholder="For example: Internet"
                 [ngModel]="newCategory()" (ngModelChange)="newCategory.set($event)" />
          <button type="button" class="btn btn-neutral" (click)="addCategory()"
                  [disabled]="addingCategory() || !newCategory().trim()">
            Add
          </button>
        </div>
      </div>
    }

    <div class="grid gap-3.5 sm:grid-cols-2 gap-x-3">
      <div class="block min-w-0">
        <label class="label" for="date">Date</label>
        <input id="date" class="input" type="date" name="date"
               [ngModel]="date()" (ngModelChange)="date.set($event)" />
      </div>

      <div class="block min-w-0">
        <label class="label" for="amount">Amount</label>
        <input id="amount" class="input text-right tabular" type="number" step="0.01" min="0"
               name="amount" [class.invalid]="errors()['amount']"
               [ngModel]="amount()" (ngModelChange)="amount.set(+$event)" />
        @if (errors()['amount']) {
          <p class="error-text">{{ errors()['amount'] }}</p>
        }
      </div>
    </div>

    <div class="block min-w-0">
      <label class="label" for="method">Paid by</label>
      <select id="method" class="select" name="method"
              [ngModel]="method()" (ngModelChange)="method.set($event)">
        <option value="Cash">Cash, from the drawer</option>
        <option value="Bank">Bank</option>
        <option value="Card">Card</option>
      </select>
    </div>

    <div class="block min-w-0">
      <label class="label" for="note">Note</label>
      <input id="note" class="input" name="note"
             [ngModel]="note()" (ngModelChange)="note.set($event)" />
    </div>
  </form>

  <div drawerFooter class="contents">
    <button type="button" class="btn btn-neutral" (click)="close()">Cancel</button>
    <button type="submit" form="expense-form" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Saving' : editingId() ? 'Save changes' : 'Record expense' }}
    </button>
  </div>
</tt-drawer>
